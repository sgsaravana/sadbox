name: Update README on release

# When a release is published, rewrite the "Latest release" line in README.md
# (between the LATEST_RELEASE markers) with the new tag, date, and notes link,
# then commit it back to main.
#
# Pre-releases are ignored, whether they arrive as a release event or by a
# manual dispatch for a tag: a beta must never become the README's latest.
#
# Tag-push releases are covered too: release.yml's bump-main runs the same
# script (scripts/set-readme-release.sh) because the release that workflow
# creates cannot trigger this one — GitHub suppresses event chains from
# GITHUB_TOKEN. This workflow is then for releases published from the UI, and
# for re-syncing a missed one by hand (workflow_dispatch).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (blank = latest)"
        required: false

permissions:
  contents: write

concurrency:
  # release.yml's bump-main writes to main too; keep the two apart.
  group: main-writes
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release details
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          data="$(gh release view "$TAG" --json tagName,name,url,publishedAt,isPrerelease)"
          {
            echo "tag=$(echo "$data"  | jq -r '.tagName')"
            echo "url=$(echo "$data"  | jq -r '.url')"
            echo "name=$(echo "$data" | jq -r '.name // .tagName')"
            echo "date=$(echo "$data" | jq -r '.publishedAt // ""' | cut -c1-10)"
            echo "prerelease=$(echo "$data" | jq -r '.isPrerelease')"
          } >> "$GITHUB_OUTPUT"

      - name: Leave the README alone for a pre-release
        # Also by tag name: this workflow can start before release.yml has
        # marked a dashed UI release as a pre-release.
        if: steps.rel.outputs.prerelease == 'true' || contains(steps.rel.outputs.tag, '-')
        run: echo "::notice::${{ steps.rel.outputs.tag }} is a pre-release — not touching the README's latest-release line."

      - name: Rewrite README latest-release block
        if: steps.rel.outputs.prerelease != 'true' && !contains(steps.rel.outputs.tag, '-')
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          URL: ${{ steps.rel.outputs.url }}
          NAME: ${{ steps.rel.outputs.name }}
          DATE: ${{ steps.rel.outputs.date }}
        run: ./scripts/set-readme-release.sh "$TAG" "$URL" "$NAME" "$DATE"

      - name: Commit & push if changed
        if: steps.rel.outputs.prerelease != 'true' && !contains(steps.rel.outputs.tag, '-')
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already reflects ${{ steps.rel.outputs.tag }} — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): latest release ${{ steps.rel.outputs.tag }} [skip ci]"
          git push origin HEAD:main
