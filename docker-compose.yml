# sadbox on a Linux host with KVM, as a container (README: Install → Linux, with docker compose).
#
#   docker compose build
#   docker compose run --rm sadbox sadbox setup     # builds the VM image (a few minutes)
#   docker compose up -d                            # http://localhost:7070
#
# Each project is a microVM on the host's /dev/kvm; the Cloud Hypervisor
# processes that run them live in this container, so the VMs stop when the
# container does (an upgrade, `docker compose down`), keeping their
# disks; start them again from the UI. Not for macOS hosts — run sadbox
# natively there.
services:
  sadbox:
    image: ${SADBOX_IMAGE:-sadbox:latest}
    build: .
    # the host's network: port forwards listen on whatever host port you pick,
    # and the UI stays on this machine's localhost unless SADBOX_HOST says otherwise
    network_mode: host
    devices:
      - /dev/kvm
    volumes:
      - ${SADBOX_DATA_DIR:-sadbox-data}:/data
      # the host's docker builds the VM image (`sadbox setup`, and after an
      # upgrade that changes it). Whoever controls this container controls the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # local folders to create projects from, at the same path as on the host
      - ${SADBOX_PROJECTS:-/srv/sadbox/projects}:${SADBOX_PROJECTS:-/srv/sadbox/projects}
    environment:
      - SADBOX_PASSWORD
      - SADBOX_HOST
      - SADBOX_PORT
      - SADBOX_PROXY_PORT
      - SADBOX_FORWARD_HOST
      - SADBOX_APPROVAL_TIMEOUT_MS
    init: true # reaps what the VMs leave behind
    restart: unless-stopped

volumes:
  sadbox-data:
