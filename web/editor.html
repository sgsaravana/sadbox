<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>sadbox editor</title>
<style>
  /* One Dark, as Zed ships it */
  :root {
    --bg: #282c33; --panel: #2f343e; --bar: #3b414d; --border: #464b57; --line: #363c46;
    --text: #dce0e5; --dim: #a9afbc; --faint: #878a98; --accent: #74ade8; --sel: #454a56;
    --ok: #a1c181; --warn: #dec184; --bad: #d07277;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 13px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #main { flex: 1; min-height: 0; display: flex; }

  /* file tree */
  #side { width: 260px; flex: 0 0 auto; background: var(--panel); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; min-width: 140px; }
  #side-head { display: flex; align-items: center; gap: 2px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--border); }
  #side-head .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { color: var(--dim); border-radius: 4px; padding: 2px 6px; font-size: 13px; line-height: 1.3; }
  .icon-btn:hover { background: var(--bar); color: var(--text); }
  #tree { flex: 1; overflow: auto; padding: 4px 0 20px; user-select: none; }
  .row { display: flex; align-items: center; height: 24px; padding-right: 6px; cursor: pointer; white-space: nowrap; color: var(--dim); }
  .row:hover { background: #363c46; color: var(--text); }
  .row.active { background: var(--sel); color: var(--text); }
  .row .tw { width: 14px; flex: 0 0 auto; text-align: center; font-size: 9px; color: var(--faint); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row.dir .nm { color: var(--text); }
  /* git state, as in Zed's project panel: new = green, changed = amber */
  .row.g-new .nm { color: var(--ok); }
  .row.g-modified .nm { color: var(--warn); }
  .row.g-renamed .nm { color: var(--accent); }
  .row.g-conflict .nm { color: var(--bad); }
  .row.g-ignored .nm { color: var(--faint); }
  .row .acts { display: none; }
  .row:hover .acts { display: flex; }
  .row .acts button { color: var(--faint); padding: 0 4px; font-size: 12px; border-radius: 3px; }
  .row .acts button:hover { color: var(--text); background: var(--bar); }
  .tree-msg { padding: 3px 12px; color: var(--faint); font-style: italic; }
  #grip { width: 4px; margin-left: -2px; margin-right: -2px; cursor: col-resize; z-index: 5; flex: 0 0 auto; }
  #grip:hover { background: var(--accent); }

  /* tabs + editor */
  #work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; flex: 0 0 auto; min-height: 33px; }
  #tabs::-webkit-scrollbar { height: 0; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; height: 32px; border-right: 1px solid var(--border);
         color: var(--dim); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--bg); color: var(--text); box-shadow: inset 0 -1px 0 var(--bg); margin-bottom: -1px; height: 33px; }
  .tab .x { width: 16px; height: 16px; border-radius: 4px; color: var(--faint); font-size: 14px; line-height: 14px; text-align: center; }
  .tab .x:hover { background: var(--bar); color: var(--text); }
  .tab.dirty .x::before { content: "●"; font-size: 10px; color: var(--accent); }
  .tab.dirty .x:hover::before { content: "×"; font-size: 14px; color: var(--text); }
  .tab:not(.dirty) .x::before { content: "×"; }
  .tab.g-new .lbl { color: var(--ok); }
  .tab.g-modified .lbl { color: var(--warn); }
  .tab.g-renamed .lbl { color: var(--accent); }
  .tab.g-conflict .lbl { color: var(--bad); }
  .tab.g-ignored .lbl { color: var(--faint); }
  /* changed in the VM under an open tab: amber whatever its git state, and slanted to tell it from "modified" */
  .tab.stale .lbl { color: var(--warn); font-style: italic; }
  #stage { flex: 1; min-height: 0; position: relative; }
  #editor { position: absolute; inset: 0; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 10px; color: var(--faint); background: var(--bg); z-index: 4; }
  #empty .big { font-size: 15px; color: var(--dim); }
  kbd { background: var(--panel); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
        padding: 0 5px; font: 11px system-ui; color: var(--dim); }
  #banner { display: none; align-items: center; gap: 10px; padding: 6px 12px; background: #4a3f2a; color: #f0dcae;
            border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  #banner.show { display: flex; }
  #banner .grow { flex: 1; }
  #banner button { border: 1px solid #7a6a45; border-radius: 4px; padding: 2px 9px; }
  #banner button:hover { background: #5c4f34; }

  /* status bar */
  #status { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px;
            background: var(--panel); border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  #status .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #st-msg.ok { color: var(--ok); } #st-msg.bad { color: var(--bad); }

  #st-stage { color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; font-size: 12px; line-height: 18px; }
  #st-stage:hover { border-color: var(--accent); }

  /* commit */
  #commit { display: none; position: fixed; inset: 0; z-index: 50; background: #0006; justify-content: center; align-items: flex-start; padding-top: 10vh; }
  #commit.show { display: flex; }
  #commit .box { width: min(640px, 92vw); background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
                 box-shadow: 0 12px 40px #000a; overflow: hidden; display: flex; flex-direction: column; }
  #commit .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--dim); font-size: 12px; }
  #commit .bar .grow { flex: 1; }
  #commit .bar b { color: var(--text); font-size: 13px; }
  #commit button { color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 10px; font-size: 12px; }
  #commit button:hover:not(:disabled) { border-color: var(--accent); }
  #commit button:disabled { opacity: 0.5; cursor: default; }
  #commit #cm-go { background: var(--accent); border-color: var(--accent); color: #fff; padding: 4px 14px; }
  #cm-branch { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cm-amend-l { display: flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; white-space: nowrap; }
  #cm-note.warn { color: var(--warn); }
  #commit .bar + .bar { padding-top: 0; }
  #cm-list { max-height: 40vh; overflow: auto; padding: 4px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .cm-row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
  .cm-row:hover { background: var(--sel); }
  .cm-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cm-row .st { color: var(--faint); font-size: 12px; }
  .cm-row.g-new .nm { color: var(--ok); } .cm-row.g-modified .nm { color: var(--warn); }
  .cm-row.g-renamed .nm { color: var(--accent); } .cm-row.g-conflict .nm { color: var(--bad); }
  .cm-row.g-deleted .nm { color: var(--bad); text-decoration: line-through; }
  .cm-row .cm-x { visibility: hidden; border: 0 !important; padding: 0 6px !important; color: var(--dim) !important; font-size: 14px !important; }
  .cm-row:hover .cm-x { visibility: visible; }
  .cm-row .cm-x:hover { color: var(--bad) !important; }
  #commit button.bad { color: var(--bad); }
  #commit button.bad:hover:not(:disabled) { border-color: var(--bad); }
  #cm-stashes { max-height: 18vh; overflow: auto; padding: 4px; border-bottom: 1px solid var(--border); }
  #cm-stashes .hd { padding: 2px 8px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .st-row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; }
  .st-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #cm-msg { margin: 10px 12px 0; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
            border-radius: 5px; font: 13px "SF Mono", Menlo, monospace; resize: vertical; outline: none; }
  #cm-msg:focus { border-color: var(--accent); }

  /* quick open */
  #palette, #branches { display: none; position: fixed; inset: 0; z-index: 50; background: #0006; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  #palette.show, #branches.show { display: flex; }
  #palette .box, #branches .box { width: min(620px, 90vw); background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
                  box-shadow: 0 12px 40px #000a; overflow: hidden; }
  #palette input, #branches input { width: 100%; padding: 11px 14px; background: none; border: 0; border-bottom: 1px solid var(--border);
                   color: var(--text); font: 14px system-ui; outline: none; }
  #pal-list, #br-list { max-height: 46vh; overflow: auto; padding: 4px; }
  #br-list .cur { color: var(--ok); }
  #st-branch { color: var(--dim); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #st-branch:hover { color: var(--text); }
  .pal-item { padding: 5px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .pal-item.sel { background: var(--sel); }
  .pal-item .dir { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-empty { padding: 10px 12px; color: var(--faint); }

  /* changed lines, against the last commit: a bar in the gutter — green added,
     amber modified — and a red wedge where lines were removed */
  .ace_gutter-cell.gd-add, .ace_gutter-cell.gd-mod, .ace_gutter-cell.gd-del, .ace_gutter-cell.gd-del-below { cursor: pointer; }
  .ace_gutter-cell.gd-add { box-shadow: inset 3px 0 0 var(--ok); }
  .ace_gutter-cell.gd-mod { box-shadow: inset 3px 0 0 var(--warn); }
  .ace_gutter-cell.gd-del::before, .ace_gutter-cell.gd-del-below::after {
    content: ""; position: absolute; left: 0; border: 4px solid transparent; border-left: 6px solid var(--bad); }
  /* already staged: the same marks, hollow */
  .ace_gutter-cell.gd-add.gd-staged { box-shadow: inset 1px 0 0 var(--ok), inset 3px 0 0 var(--bg), inset 4px 0 0 var(--ok); }
  .ace_gutter-cell.gd-mod.gd-staged { box-shadow: inset 1px 0 0 var(--warn), inset 3px 0 0 var(--bg), inset 4px 0 0 var(--warn); }
  .ace_gutter-cell.gd-del.gd-staged::before, .ace_gutter-cell.gd-del-below.gd-staged::after { opacity: 0.45; }
  .ace_gutter-cell.gd-del::before { top: -4px; }
  .ace_gutter-cell.gd-del-below::after { bottom: -4px; }
  .gd-peek { box-sizing: border-box; background: #2b2f37; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
             font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
  .gd-peek .hd { display: flex; align-items: center; gap: 10px; padding: 3px 10px; font: 12px system-ui; color: var(--dim); background: var(--panel); }
  .gd-peek .hd .grow { flex: 1; }
  .gd-peek .hd button { color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 1px 8px; font-size: 12px; }
  .gd-peek .hd button:hover { border-color: var(--accent); }
  .gd-peek .hd button:disabled { opacity: 0.5; }
  .gd-peek .hd .tag { color: var(--ok); }
  .gd-peek pre { margin: 0; padding: 2px 0; max-height: 240px; overflow: auto; background: rgba(208, 114, 119, 0.13); color: var(--text); }
  .gd-peek pre div { padding: 0 10px; white-space: pre; min-height: 1.55em; }
  .gd-peek pre div::before { content: "−"; color: var(--bad); margin-right: 10px; }

  /* blend Ace into the page */
  .ace_editor { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace !important; }
  .ace-one-dark, .ace-one-dark .ace_gutter { background: var(--bg) !important; }
  .ace-one-dark .ace_gutter { color: #4e5a6a !important; }
  .ace-one-dark .ace_marker-layer .ace_active-line, .ace-one-dark .ace_gutter-active-line { background: #2f343e !important; }
</style>
<body>
  <div id="main">
    <aside id="side">
      <div id="side-head">
        <span class="title" id="proj-name">workdir</span>
        <button class="icon-btn" id="btn-open" title="Go to file (⌘P)">⌕</button>
        <button class="icon-btn" id="btn-newfile" title="New file">＋</button>
        <button class="icon-btn" id="btn-newdir" title="New folder">▣</button>
        <button class="icon-btn" id="btn-commit" title="Commit… — stage files and commit them in the VM">✓</button>
        <button class="icon-btn" id="btn-refresh" title="Refresh the tree">⟳</button>
      </div>
      <div id="tree"></div>
    </aside>
    <div id="grip"></div>
    <section id="work">
      <div id="tabs"></div>
      <div id="banner">
        <span class="grow" id="banner-text"></span>
        <button id="banner-reload">Reload from VM</button>
        <button id="banner-keep">Keep mine</button>
      </div>
      <div id="stage">
        <div id="editor"></div>
        <div id="empty">
          <div class="big">Pick a file from the tree</div>
          <div><kbd>⌘</kbd> <kbd>P</kbd> go to file &nbsp;·&nbsp; <kbd>⌘</kbd> <kbd>S</kbd> save &nbsp;·&nbsp; <kbd>⌘</kbd> <kbd>F</kbd> find</div>
        </div>
      </div>
    </section>
  </div>
  <div id="status">
    <button id="st-branch" hidden title="Switch branch in the VM"></button>
    <span class="grow" id="st-path"></span>
    <button id="st-stage" hidden></button>
    <span id="st-msg"></span>
    <span id="st-pos"></span>
    <span id="st-lang"></span>
  </div>
  <div id="palette"><div class="box">
    <input id="pal-input" placeholder="Go to file…" autocomplete="off" spellcheck="false">
    <div id="pal-list"></div>
  </div></div>

  <div id="branches"><div class="box">
    <input id="br-input" placeholder="Switch to a branch, or type a new name…" autocomplete="off" spellcheck="false">
    <div id="br-list"></div>
  </div></div>
  <div id="commit"><div class="box">
    <div class="bar"><b>Commit</b><span id="cm-count"></span><span class="grow" id="cm-branch"></span>
      <button id="cm-all">Stage all</button><button id="cm-none">Unstage all</button>
      <button id="cm-stash" title="Put every uncommitted change away (new files too) and go back to the last commit; bring it back later">Stash</button>
      <button id="cm-discard" class="bad" title="Throw away every uncommitted change">Discard all</button></div>
    <div id="cm-list"></div>
    <div id="cm-stashes" hidden></div>
    <textarea id="cm-msg" rows="3" placeholder="Commit message" spellcheck="false"></textarea>
    <div class="bar"><label id="cm-amend-l" title="Rewrite the last commit: what is staged is added to it, and its message replaced"><input type="checkbox" id="cm-amend"> Amend last commit</label>
      <span class="grow" id="cm-note"></span></div>
    <div class="bar"><button id="cm-push" hidden></button><span class="grow"></span><button id="cm-cancel">Cancel</button><button id="cm-go">Commit</button></div>
  </div></div>

  <script src="/vendor/ace/ace.js"></script>
  <script src="/vendor/ace/ext-modelist.js"></script>
  <script src="/vendor/ace/ext-searchbox.js"></script>
  <script src="/vendor/ace/theme-one_dark.js"></script>
  <script src="/net-asks.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const projectId = params.get("id");
    const projName = params.get("name") || projectId;
    document.title = `${projName} — editor`;
    $("#proj-name").textContent = projName;
    const API = `/api/projects/${encodeURIComponent(projectId)}`;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // fetch wrapper that keeps the status + parsed body on failure (409 conflicts need both)
    async function api(path, opts = {}) {
      const r = await fetch(API + path, {
        method: opts.method || "GET",
        headers: opts.body ? { "content-type": "application/json" } : undefined,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (r.status === 401) throw Object.assign(new Error("Signed out — sign in again in another tab, then retry"), { status: 401, data: {} });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status, data });
      return data;
    }
    const qs = (path) => `?path=${encodeURIComponent(path)}`;
    const base = (p) => p.slice(p.lastIndexOf("/") + 1);
    const parent = (p) => (p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
    const join = (dir, name) => (dir ? `${dir}/${name}` : name);

    let msgTimer;
    function flash(text, cls = "") {
      const el = $("#st-msg");
      el.textContent = text; el.className = cls;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => { el.textContent = ""; }, 4000);
    }

    // ---- Ace ----
    ace.config.set("basePath", "/vendor/ace");
    const modelist = ace.require("ace/ext/modelist");
    const editor = ace.edit("editor", {
      theme: "ace/theme/one_dark", fontSize: 13, showPrintMargin: false, useWorker: false,
      tabSize: 2, useSoftTabs: true, scrollPastEnd: 0.3, displayIndentGuides: true, highlightSelectedWord: true,
    });
    editor.container.style.lineHeight = "1.55";
    editor.renderer.updateFontSize();
    let modes = new Set(["text"]); // language modes the supervisor actually ships
    fetch("/api/editor/modes").then((r) => r.json()).then((m) => {
      modes = new Set(m);
      for (const t of tabs) applyMode(t); // files opened before the list arrived
    }).catch(() => {});

    function applyMode(tab) {
      const m = modelist.getModeForPath(tab.path);
      const known = modes.has(m.name);
      tab.lang = known ? m.caption : "Plain Text";
      tab.session.setMode(known ? m.mode : "ace/mode/text");
      if (tab === active) $("#st-lang").textContent = tab.lang;
    }

    // ---- tabs ----
    // tab: { path, session, hash (as last loaded/saved; null = not on disk yet), dirty, stale, lang }
    const tabs = [];
    let active = null;

    function makeSession(tab, content) {
      const s = ace.createEditSession(content);
      s.setUseWorker(false);
      s.setTabSize(2); s.setUseSoftTabs(true);
      s.on("change", () => setTimeout(() => {
        const dirty = !s.getUndoManager().isClean();
        if (dirty !== tab.dirty) { tab.dirty = dirty; renderTabs(); }
      }, 0));
      s.selection.on("changeCursor", () => { if (tab === active) showPos(); });
      s.on("change", () => { closePeek(tab); clearTimeout(tab.diffTimer); tab.diffTimer = setTimeout(() => markChanges(tab), 120); });
      tab.session = s;
      applyMode(tab);
    }

    function showPos() {
      if (!active) { $("#st-pos").textContent = ""; return; }
      const c = active.session.selection.getCursor();
      $("#st-pos").textContent = `${c.row + 1}:${c.column + 1}`;
    }

    function renderTabs() {
      $("#tabs").innerHTML = tabs.map((t, i) => {
        // show the folder too when two open files share a name
        const twin = tabs.some((o) => o !== t && base(o.path) === base(t.path));
        const label = twin && parent(t.path) ? `${base(t.path)} — ${parent(t.path)}` : base(t.path);
        const g = gitState(t.path, false);
        return `<div class="tab${t === active ? " active" : ""}${t.dirty ? " dirty" : ""}${t.stale ? " stale" : ""}${g ? ` g-${g}` : ""}" data-i="${i}" title="${esc(t.path)}${g ? ` — ${GIT_LABEL[g]}` : ""}">
          <span class="lbl">${esc(label)}</span><button class="x" data-close="${i}" title="Close"></button></div>`;
      }).join("");
      $("#tabs .tab.active")?.scrollIntoView({ block: "nearest", inline: "nearest" });
      showStageBtn();
    }

    // ---- staging whole files, and committing ----
    /** How much of a file is staged: "all" · "some" · "none" · null when it has no changes. */
    function fileStage(path) {
      if (git.staged[path]) return git.staged[path];
      const st = gitState(path, false);
      return st && st !== "ignored" ? "none" : null;
    }
    function showStageBtn() {
      const br = $("#st-branch");
      br.hidden = !git.repo;
      br.textContent = `⎇ ${git.branch || "detached"}`;
      const b = $("#st-stage");
      const st = active && (fileStage(active.path) || (active.dirty ? "none" : null));
      b.hidden = !st || !git.repo;
      if (st) {
        b.textContent = st === "all" ? "Unstage file" : "Stage file";
        b.title = st === "all" ? "Take this file out of the next commit" : "Put every change in this file in the next commit (saves it first)";
      }
    }
    /** Stage or unstage whole paths ("all" = everything). Open files with unsaved edits are saved first. */
    async function setStaged(paths, on) {
      if (on) for (const t of tabs) if (t.dirty && (paths === "all" || paths.includes(t.path))) { await save(t); if (t.dirty) return false; }
      try { await api("/files/stage", { method: "POST", body: { paths, on } }); }
      catch (e) { flash(`${on ? "Stage" : "Unstage"} failed: ${e.message}`, "bad"); return false; }
      if (await loadGit()) renderTree();
      return true;
    }
    $("#st-stage").addEventListener("click", async () => {
      if (!active) return;
      const on = fileStage(active.path) !== "all";
      if (await setStaged([active.path], on)) flash(on ? `Staged ${base(active.path)}` : `Unstaged ${base(active.path)}`, "ok");
    });

    function renderCommit() {
      const rows = [
        ...Object.entries(git.files).filter(([, st]) => st !== "ignored").map(([path, st]) => ({ path, st, staged: git.staged[path] || "none" })),
        ...Object.entries(git.dirs).filter(([, st]) => st !== "ignored").map(([path, st]) => ({ path, st, staged: "none", dir: true })),
      ].sort((a, b) => a.path.localeCompare(b.path));
      const n = rows.filter((r) => r.staged !== "none").length;
      $("#cm-count").textContent = rows.length ? `${n} of ${rows.length} staged` : "";
      $("#cm-list").innerHTML = rows.length
        ? rows.map((r) => `<label class="cm-row g-${r.st}"><input type="checkbox" data-path="${esc(r.path)}"${r.staged === "all" ? " checked" : ""}${r.staged === "some" ? " data-some" : ""}>
            <span class="nm">${esc(r.path)}${r.dir ? "/" : ""}</span><span class="st">${r.staged === "some" ? "partly staged · " : ""}${r.dir ? "new folder" : r.st}</span><button class="cm-x" data-discard="${esc(r.path)}" title="Discard the changes to this ${r.dir ? "folder" : "file"}">↶</button></label>`).join("")
        : `<div class="pal-empty">nothing has changed since the last commit</div>`;
      for (const c of $("#cm-list").querySelectorAll("[data-some]")) c.indeterminate = true;
      const unsaved = tabs.filter((t) => t.dirty).length;
      const amend = $("#cm-amend").checked;
      const pushed = !!git.upstream && git.ahead === 0;
      $("#cm-note").className = "grow" + (amend && pushed ? " warn" : "");
      $("#cm-note").textContent = amend && pushed ? "the last commit is already pushed — after amending it, pushing means overwriting the remote branch"
        : unsaved ? `${unsaved} open file${unsaved === 1 ? " has" : "s have"} unsaved edits — staging a file saves it` : "";
      $("#cm-branch").textContent = git.branch
        ? `${git.branch}${git.upstream ? ` ↑${git.ahead}${git.behind ? ` ↓${git.behind}` : ""}` : git.remote ? " · not pushed yet" : ""}` : "";
      $("#cm-all").disabled = !rows.some((r) => r.staged !== "all");
      $("#cm-none").disabled = !n;
      $("#cm-stash").disabled = $("#cm-discard").disabled = !rows.length || busyGit;
      $("#cm-stashes").hidden = !stashes.length;
      $("#cm-stashes").innerHTML = `<div class="hd">Stashes</div>` + stashes.map((x) => `<div class="st-row"><span class="nm" title="${esc(x.message)}">${esc(x.message)}</span>
        <button data-pop="${x.index}" title="Bring these changes back and remove the stash"${busyGit ? " disabled" : ""}>Pop</button><button data-drop="${x.index}" class="bad" title="Delete this stash"${busyGit ? " disabled" : ""}>Drop</button></div>`).join("");
      const files = n ? ` ${n} file${n === 1 ? "" : "s"}` : "";
      $("#cm-go").textContent = amend ? `Amend${n ? ` with${files}` : ""}` : `Commit${files}`;
      $("#cm-go").disabled = (!n && !amend) || !$("#cm-msg").value.trim() || committing;
      const p = $("#cm-push");
      p.hidden = !git.remote || !git.branch;
      p.textContent = pushing ? "Pushing…" : !git.upstream ? `Push ${git.branch}` : git.ahead ? `Push ↑${git.ahead}` : "Nothing to push";
      p.disabled = pushing || committing || (!!git.upstream && !git.ahead);
      p.title = `Push ${git.branch} to the project's git remote, from the VM`;
    }
    let committing = false, pushing = false, amendFilled = "";

    // ---- stash, discard ----
    let stashes = [], busyGit = false;
    async function loadStashes() {
      try { stashes = (await api("/files/stash")).stashes; } catch { return; }
      if ($("#commit").classList.contains("show")) renderCommit();
    }
    /** The files on disk changed wholesale: bring the tree and the open tabs in
     *  line. Tabs under `forced` paths ("all" = every tab) lose unsaved edits too. */
    async function afterDiskChange(forced) {
      await loadGit();
      await refreshTree().catch(() => {});
      for (const t of [...tabs]) {
        const force = forced === "all" || (forced || []).some((p) => t.path === p || t.path.startsWith(p + "/"));
        if (t.dirty && !force) { checkDisk(t); continue; }
        try {
          const f = await api("/file" + qs(t.path));
          if (f.hash !== t.hash || t.dirty) reloadInto(t, f);
        } catch (e) {
          if (e.status === 404) { t.dirty = false; closeTab(t); } // the file is gone with the change
        }
      }
      renderTabs(); showBanner();
      for (const t of tabs) loadBase(t);
    }
    async function gitAction(run, okMsg, forced) {
      if (busyGit) return;
      busyGit = true; renderCommit();
      let done;
      try { await run(); done = [okMsg, "ok"]; } catch (e) { done = [e.message, "bad"]; }
      busyGit = false;
      await afterDiskChange(done[1] === "ok" ? forced : null);
      await loadStashes();
      renderCommit();
      flash(...done);
    }
    function discard(paths) {
      const what = paths === "all" ? "ALL uncommitted changes in the workdir" : `the changes to ${paths.join(", ")}`;
      if (!confirm(`Discard ${what}?\n\nChanged files go back to the last commit and new files are deleted. This cannot be undone.`)) return;
      gitAction(() => api("/files/discard", { method: "POST", body: { paths } }), paths === "all" ? "Discarded all changes" : `Discarded ${paths.map(base).join(", ")}`, paths);
    }
    async function stashAll() {
      const message = prompt("Stash every uncommitted change (new files too) and go back to the last commit.\n\nA note to recognise it by (optional):", "");
      if (message === null) return;
      for (const t of tabs) if (t.dirty) { await save(t); if (t.dirty) return; } // unsaved edits belong in the stash
      gitAction(() => api("/files/stash", { method: "POST", body: { action: "push", message } }), "Stashed", null);
    }
    $("#cm-discard").addEventListener("click", () => discard("all"));
    $("#cm-stash").addEventListener("click", stashAll);
    $("#cm-list").addEventListener("click", (e) => {
      const b = e.target.closest("[data-discard]");
      if (b) { e.preventDefault(); discard([b.dataset.discard]); }
    });
    $("#cm-stashes").addEventListener("click", (e) => {
      const pop = e.target.closest("[data-pop]"), drop = e.target.closest("[data-drop]");
      if (pop) {
        if (tabs.some((t) => t.dirty)) return flash("Save the files with unsaved edits before bringing a stash back", "bad");
        gitAction(() => api("/files/stash", { method: "POST", body: { action: "pop", index: +pop.dataset.pop } }), "Stash brought back", null);
      } else if (drop && confirm("Delete this stash? The changes in it are lost.")) {
        gitAction(() => api("/files/stash", { method: "POST", body: { action: "drop", index: +drop.dataset.drop } }), "Stash deleted", null);
      }
    });
    // Amend starts from the last commit's message (unless one is being written already)
    $("#cm-amend").addEventListener("change", async () => {
      const m = $("#cm-msg");
      if ($("#cm-amend").checked) {
        if (!m.value.trim()) {
          try { const c = await api("/files/commit"); if (!m.value.trim() && $("#cm-amend").checked) m.value = amendFilled = c.message; } catch {}
        }
      } else if (m.value === amendFilled) m.value = "";
      renderCommit();
    });
    async function doPush(force = false) {
      pushing = true; renderCommit();
      try {
        const r = await api("/files/push", { method: "POST", body: { force } });
        flash(`Pushed ${r.branch}${r.forced ? " (overwrote the remote branch)" : ""}`, "ok");
      } catch (e) {
        pushing = false;
        if (e.data?.rejected && !force) {
          if (confirm(`The push was rejected: ${e.message}.\n\nOverwrite the remote branch with the VM's? Commits that exist only on the remote are lost.`)) return doPush(true);
          flash("Not pushed", "bad");
        } else flash(e.message.startsWith("push failed") ? e.message : `Push failed: ${e.message}`, "bad");
      }
      pushing = false;
      await loadGit();
      renderCommit();
    }
    $("#cm-push").addEventListener("click", () => doPush());
    function openCommit() {
      if (gitSeen && !git.repo) return flash("The workdir is not a git repository", "bad");
      $("#commit").classList.add("show");
      renderCommit();
      loadGit();
      loadStashes();
      $("#cm-msg").focus();
    }
    function closeCommit() { $("#commit").classList.remove("show"); if (active) editor.focus(); }
    async function doCommit() {
      if ($("#cm-go").disabled) return;
      committing = true; renderCommit();
      try {
        const amend = $("#cm-amend").checked;
        const r = await api("/files/commit", { method: "POST", body: { message: $("#cm-msg").value, amend } });
        $("#cm-msg").value = amendFilled = ""; $("#cm-amend").checked = false;
        if (!git.remote) closeCommit(); // otherwise stay: Push is the likely next step
        flash(`${amend ? "Amended" : "Committed"} ${r.sha} — ${r.subject}`, "ok");
      } catch (e) { flash(`Commit failed: ${e.message}`, "bad"); }
      committing = false;
      if (await loadGit()) renderTree();
      if ($("#commit").classList.contains("show")) renderCommit();
    }
    $("#btn-commit").addEventListener("click", openCommit);
    $("#cm-cancel").addEventListener("click", closeCommit);
    $("#cm-go").addEventListener("click", doCommit);
    $("#cm-all").addEventListener("click", () => setStaged("all", true).then(renderCommit));
    $("#cm-none").addEventListener("click", () => setStaged("all", false).then(renderCommit));
    $("#cm-msg").addEventListener("input", renderCommit);
    $("#cm-list").addEventListener("change", (e) => {
      const c = e.target.closest("input[data-path]");
      if (c) setStaged([c.dataset.path], c.checked).then(renderCommit);
    });
    $("#commit").addEventListener("mousedown", (e) => { if (e.target === $("#commit")) closeCommit(); });
    $("#commit").addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.preventDefault(); closeCommit(); }
      else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); doCommit(); }
    });

    // ---- switching branch ----
    let brAll = null, brItems = [], brSel = 0, brBusy = false;
    function renderBranches() {
      const query = $("#br-input").value.trim();
      if (!brAll) { $("#br-list").innerHTML = `<div class="pal-empty">reading the branches…</div>`; return; }
      const ql = query.toLowerCase();
      brItems = brAll.branches.filter((b) => b.name.toLowerCase().includes(ql)).slice(0, 200);
      if (query && !brAll.branches.some((b) => b.name === query)) brItems.push({ name: query, create: true });
      brSel = Math.min(brSel, Math.max(0, brItems.length - 1));
      $("#br-list").innerHTML = brItems.length
        ? brItems.map((b, i) => `<div class="pal-item${i === brSel ? " sel" : ""}" data-i="${i}">
            <span${b.name === brAll.current ? ` class="cur"` : ""}>${b.create ? "Create branch " : ""}${esc(b.name)}</span><span class="dir">${
              b.create ? `from ${esc(brAll.current || "here")}` : b.name === brAll.current ? "current" : b.remote ? "on the remote" : ""}</span></div>`).join("")
        : `<div class="pal-empty">no branches</div>`;
      $("#br-list .sel")?.scrollIntoView({ block: "nearest" });
    }
    async function openBranches() {
      $("#branches").classList.add("show");
      $("#br-input").value = ""; brSel = 0; brAll = null;
      $("#br-input").focus();
      renderBranches();
      try { brAll = await api("/files/branch"); } catch (e) { closeBranches(); return flash(e.message, "bad"); }
      renderBranches();
    }
    function closeBranches() { $("#branches").classList.remove("show"); if (active) editor.focus(); }
    async function pickBranch(i) {
      const b = brItems[i];
      if (!b || brBusy) return;
      if (b.name === brAll.current) return closeBranches();
      // the files on disk are about to change under the open tabs
      const unsaved = tabs.filter((t) => t.dirty);
      if (unsaved.length) return flash(`Save or close ${unsaved.length === 1 ? base(unsaved[0].path) : `the ${unsaved.length} files with unsaved edits`} before switching branch`, "bad");
      brBusy = true;
      let done;
      try {
        const r = await api("/files/branch", { method: "POST", body: { name: b.name, create: !!b.create } });
        closeBranches();
        done = [`${r.created ? "Created and switched to" : "Switched to"} ${r.branch}`, "ok"];
      } catch (e) { done = [`Not switched: ${e.message}`, "bad"]; }
      brBusy = false;
      await loadGit();
      await refreshTree().catch(() => {});
      await Promise.all([...tabs].map((t) => checkDisk(t))); // open files take the branch's content
      flash(...done);
    }
    $("#st-branch").addEventListener("click", openBranches);
    $("#br-input").addEventListener("input", () => { brSel = 0; renderBranches(); });
    $("#br-input").addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.preventDefault(); closeBranches(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); brSel = Math.min(brSel + 1, brItems.length - 1); renderBranches(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); brSel = Math.max(brSel - 1, 0); renderBranches(); }
      else if (e.key === "Enter") { e.preventDefault(); pickBranch(brSel); }
    });
    $("#br-list").addEventListener("click", (e) => { const it = e.target.closest(".pal-item"); if (it) pickBranch(+it.dataset.i); });
    $("#branches").addEventListener("mousedown", (e) => { if (e.target === $("#branches")) closeBranches(); });

    function activate(tab) {
      active = tab;
      $("#empty").style.display = tab ? "none" : "flex";
      if (tab) {
        editor.setSession(tab.session);
        editor.focus();
        $("#st-path").textContent = tab.path;
        $("#st-lang").textContent = tab.lang;
        checkDisk(tab);
        if (tab.base !== undefined) loadBase(tab); // a commit or checkout may have moved it
      } else {
        $("#st-path").textContent = ""; $("#st-lang").textContent = "";
      }
      showPos(); renderTabs(); showBanner(); markTreeActive();
    }

    async function openFile(path) {
      let tab = tabs.find((t) => t.path === path);
      if (!tab) {
        let f;
        try { f = await api("/file" + qs(path)); }
        catch (e) { flash(e.message, "bad"); return; }
        tab = tabs.find((t) => t.path === path); // opened twice while loading
        if (!tab) {
          tab = { path, hash: f.hash, dirty: false, stale: false };
          makeSession(tab, f.content);
          tabs.push(tab);
          loadBase(tab);
        }
      }
      activate(tab);
    }

    function closeTab(tab) {
      if (tab.dirty && !confirm(`Discard unsaved changes to ${base(tab.path)}?`)) return;
      const i = tabs.indexOf(tab);
      tabs.splice(i, 1);
      tab.session.destroy?.();
      if (tab === active) activate(tabs[Math.min(i, tabs.length - 1)] || null);
      else renderTabs();
    }

    $("#tabs").addEventListener("click", (e) => {
      const x = e.target.closest("[data-close]");
      if (x) { e.stopPropagation(); return closeTab(tabs[+x.dataset.close]); }
      const t = e.target.closest(".tab");
      if (t) activate(tabs[+t.dataset.i]);
    });
    $("#tabs").addEventListener("auxclick", (e) => {
      const t = e.target.closest(".tab");
      if (t && e.button === 1) { e.preventDefault(); closeTab(tabs[+t.dataset.i]); }
    });

    // ---- save, and noticing the agent's edits ----
    async function save(tab = active, force = false) {
      if (!tab) return;
      const content = tab.session.getValue();
      try {
        const r = await api("/file", { method: "PUT", body: { path: tab.path, content, baseHash: tab.hash, force } });
        tab.hash = r.hash; tab.stale = false;
        // only clean if nothing was typed while the save was in flight
        if (tab.session.getValue() === content) { tab.session.getUndoManager().markClean(); tab.dirty = false; }
        flash(`Saved ${base(tab.path)}`, "ok");
        renderTabs(); showBanner();
        loadGit().then((changed) => { if (changed) renderTree(); });
      } catch (e) {
        if (e.status === 409 && e.data?.conflict) { tab.stale = true; renderTabs(); showBanner(); flash("Not saved — the file changed in the VM", "bad"); }
        else flash(`Save failed: ${e.message}`, "bad");
      }
    }

    // The agent edits these files too. When a tab comes to the front (or the
    // window regains focus), compare with the VM: an untouched tab just picks up
    // the new content; one with unsaved edits is flagged instead of overwritten.
    async function checkDisk(tab) {
      if (!tab || tab.checking) return;
      tab.checking = true;
      try {
        const f = await api("/file" + qs(tab.path));
        if (f.hash === tab.hash) { if (tab.stale && !tab.dirty) { tab.stale = false; renderTabs(); showBanner(); } return; }
        if (tab.dirty) { tab.stale = true; }
        else { reloadInto(tab, f); flash(`${base(tab.path)} updated from the VM`); }
        renderTabs(); showBanner();
      } catch (e) {
        if (e.status === 404 && tab.hash != null) { tab.stale = true; tab.gone = true; renderTabs(); showBanner(); }
      } finally { tab.checking = false; }
    }

    function reloadInto(tab, f) {
      const pos = tab.session.selection.getCursor();
      const top = tab.session.getScrollTop();
      tab.session.setValue(f.content);          // also resets undo → clean
      tab.session.selection.moveCursorToPosition(pos);
      tab.session.setScrollTop(top);
      tab.hash = f.hash; tab.dirty = false; tab.stale = false; tab.gone = false;
    }

    function showBanner() {
      const b = $("#banner");
      if (!active?.stale) { b.classList.remove("show"); editor.resize(); return; }
      $("#banner-text").textContent = active.gone
        ? `${base(active.path)} was deleted in the VM.`
        : `${base(active.path)} changed in the VM while you had unsaved edits.`;
      $("#banner-reload").hidden = !!active.gone;
      $("#banner-keep").textContent = active.gone ? "Save it back" : "Overwrite with mine";
      b.classList.add("show");
      editor.resize();
    }
    $("#banner-reload").onclick = async () => {
      const tab = active;
      try { reloadInto(tab, await api("/file" + qs(tab.path))); renderTabs(); showBanner(); }
      catch (e) { flash(e.message, "bad"); }
    };
    $("#banner-keep").onclick = () => save(active, true);
    addEventListener("focus", () => checkDisk(active));

    // ---- changed lines (the git gutter) ----
    // Each buffer is compared, as you type, with the file's last committed
    // version. tab.base: undefined = not known yet · null = nothing to compare
    // with · { lines } = the committed lines (an empty file's, if it is all new).
    async function loadBase(tab) {
      let r;
      try { r = await api("/file/head" + qs(tab.path)); } catch { return; }
      if (!tabs.includes(tab)) return;
      setBase(tab, r);
    }
    const split = (text) => text.split(/\r?\n/);
    function setBase(tab, r) {
      const lines = !r.repo ? null : !r.inHead ? [""] : r.content == null ? null : split(r.content);
      // what is staged, as lines — null when it cannot be worked with (a
      // conflict, or not text), which leaves the marks but turns staging off
      const index = !lines ? null : !r.inIndex ? (r.inHead ? null : [""]) : r.index == null ? null : split(r.index);
      const key = JSON.stringify([r.repo, r.inHead, r.content, r.indexOid, index == null]);
      if (tab.baseKey === key) return;
      tab.baseKey = key;
      tab.base = lines ? { lines, fresh: !r.inHead, index, indexOid: r.indexOid, staged: index ? withLines(diffLines(lines, index), index) : [] } : null;
      markChanges(tab);
    }
    const withLines = (hunks, lines) => hunks.map((h) => ({ ...h, lines: lines.slice(h.row, h.row + h.count) }));
    // two changes to the same stretch of the committed file (touching counts)
    const touches = (a, b) => a.oldRow <= b.oldRow + b.oldCount && b.oldRow <= a.oldRow + a.oldCount;
    const sameHunk = (a, b) => a.oldRow === b.oldRow && a.oldCount === b.oldCount &&
      a.lines.length === b.lines.length && a.lines.every((l, i) => l === b.lines[i]);
    /** The committed lines with these changes made to them. */
    function applyHunks(lines, hunks) {
      const out = [];
      let at = 0;
      for (const h of [...hunks].sort((a, b) => a.oldRow - b.oldRow)) {
        for (; at < h.oldRow; at++) out.push(lines[at]);
        for (const l of h.lines) out.push(l);
        at = h.oldRow + h.oldCount;
      }
      for (; at < lines.length; at++) out.push(lines[at]);
      return out;
    }

    // Stage or unstage one hunk: the index gets the committed file with every
    // change already staged, plus (or minus) this one. What is staged comes from
    // the saved file, so unsaved edits are saved first.
    async function stageHunk(tab, hunk, on) {
      if (tab.dirty) { await save(tab); if (tab.dirty) return; }
      try {
        setBase(tab, await api("/file/head" + qs(tab.path))); // the agent may have staged things meanwhile
        const b = tab.base;
        if (!b?.index) return flash("Cannot stage this file here", "bad");
        const h = tab.hunks.find((x) => x.oldRow === hunk.oldRow && x.oldCount === hunk.oldCount && x.row === hunk.row && x.count === hunk.count);
        if (!h) return flash("The file changed — try again", "bad");
        const kept = b.staged.filter((x) => !touches(x, h));
        const lines = applyHunks(b.lines, on ? [...kept, h] : kept);
        const asCommitted = lines.length === b.lines.length && lines.every((l, i) => l === b.lines[i]);
        const content = asCommitted ? null : lines.join(tab.session.doc.getNewLineCharacter());
        await api("/file/index", { method: "PUT", body: { path: tab.path, content, expect: b.indexOid } });
        flash(on ? "Staged" : "Unstaged", "ok");
      } catch (e) { flash(`${on ? "Stage" : "Unstage"} failed: ${e.message}`, "bad"); }
      await loadBase(tab);
      loadGit().then((changed) => { if (changed) renderTree(); });
    }

    /** Line diff (Myers), as hunks: `count` lines at `row` of `b` replace
     *  `oldCount` lines at `oldRow` of `a`. */
    function diffLines(a, b) {
      let s = 0, n = a.length, m = b.length;
      while (s < n && s < m && a[s] === b[s]) s++;
      let e = 0;
      while (e < n - s && e < m - s && a[n - 1 - e] === b[m - 1 - e]) e++;
      const N = n - s - e, M = m - s - e;
      if (!N && !M) return [];
      const whole = [{ row: s, count: M, oldRow: s, oldCount: N }];
      if (!N || !M) return whole;
      const max = Math.min(N + M, 1500), off = max + 1; // past that many edits, call it one change
      let v = new Int32Array(2 * max + 3), found = -1;
      const trace = [];
      search: for (let d = 0; d <= max; d++) {
        trace.push(v.slice());
        for (let k = -d; k <= d; k += 2) {
          let x = k === -d || (k !== d && v[k - 1 + off] < v[k + 1 + off]) ? v[k + 1 + off] : v[k - 1 + off] + 1;
          let y = x - k;
          while (x < N && y < M && a[s + x] === b[s + y]) { x++; y++; }
          v[k + off] = x;
          if (x >= N && y >= M) { found = d; break search; }
        }
      }
      if (found < 0) return whole;
      const gone = new Uint8Array(N), came = new Uint8Array(M);
      for (let d = found, x = N, y = M; d > 0; d--) {
        const pv = trace[d], k = x - y;
        const pk = k === -d || (k !== d && pv[k - 1 + off] < pv[k + 1 + off]) ? k + 1 : k - 1;
        const px = pv[pk + off], py = px - pk;
        if (pk === k + 1) came[py] = 1; else gone[px] = 1;
        x = px; y = py;
      }
      const hunks = [];
      for (let i = 0, j = 0; i < N || j < M;) {
        if (!(gone[i] || came[j])) { i++; j++; continue; }
        const h = { row: s + j, oldRow: s + i, count: 0, oldCount: 0 };
        while (gone[i] || came[j]) {
          while (gone[i]) { i++; h.oldCount++; }
          while (came[j]) { j++; h.count++; }
        }
        hunks.push(h);
      }
      return hunks;
    }

    const GD = /\s*\bgd-[a-z-]+/g;
    function markChanges(tab) {
      const sess = tab.session;
      // clear our marks wherever edits have carried them
      const decos = sess.$decorations;
      for (let i = 0; i < decos.length; i++) if (decos[i]) decos[i] = decos[i].replace(GD, "");
      tab.hunks = [];
      if (tab.base && gitState(tab.path, false) !== "ignored") {
        const lines = sess.doc.getAllLines();
        tab.hunks = withLines(diffLines(tab.base.lines, lines), lines);
        for (const h of tab.hunks) {
          h.staged = tab.base.staged.some((x) => sameHunk(x, h));
          const st = h.staged ? " gd-staged" : "";
          if (!h.count) {
            // lines removed: a wedge on the boundary they were taken from
            if (h.row < lines.length) sess.addGutterDecoration(h.row, "gd-del" + st);
            else sess.addGutterDecoration(lines.length - 1, "gd-del-below" + st);
          } else {
            const cls = (h.oldCount && !tab.base.fresh ? "gd-mod" : "gd-add") + st;
            for (let r = h.row; r < h.row + h.count; r++) sess.addGutterDecoration(r, cls);
          }
        }
      }
      sess._signal("changeBreakpoint", {}); // repaint the gutter
    }

    // Click a mark to see what the lines were, and put them back.
    const { LineWidgets } = ace.require("ace/line_widgets");
    function closePeek(tab) {
      if (!tab?.peek) return;
      tab.session.widgetManager?.removeLineWidget(tab.peek);
      tab.peek = null;
    }
    function hunkAt(tab, row) {
      const last = tab.session.getLength() - 1;
      return (tab.hunks || []).find((h) => h.count
        ? row >= h.row && row < h.row + h.count
        : row === Math.min(h.row, last));
    }
    function openPeek(tab, h) {
      const sess = tab.session;
      if (!sess.widgetManager) { sess.widgetManager = new LineWidgets(sess); sess.widgetManager.attach(editor); }
      const old = tab.base.lines.slice(h.oldRow, h.oldRow + h.oldCount);
      const el = document.createElement("div");
      el.className = "gd-peek";
      const what = !h.count ? `${h.oldCount} line${h.oldCount === 1 ? "" : "s"} removed`
        : !h.oldCount ? `${h.count} line${h.count === 1 ? "" : "s"} added`
        : `${h.count} line${h.count === 1 ? "" : "s"} changed — was:`;
      const canStage = !!tab.base.index;
      el.innerHTML = `<div class="hd"><span>${what}</span>${h.staged ? `<span class="tag">staged</span>` : ""}<span class="grow"></span>` +
        (h.staged
          ? (canStage ? `<button data-gd="unstage" title="Take this change out of the next commit; the file is not touched">Unstage</button>` : "")
          : (canStage ? `<button data-gd="stage" title="Put this change in the next commit (saves the file first)">Stage</button>` : "") +
            `<button data-gd="restore" title="Put this part of the file back as last committed">Restore</button>`) +
        `<button data-gd="close">Close</button></div>` +
        (old.length ? `<pre>${old.map((l) => `<div>${esc(l)}</div>`).join("")}</pre>` : "");
      el.addEventListener("mousedown", (e) => e.stopPropagation());
      el.addEventListener("click", (e) => {
        const act = e.target.dataset?.gd;
        if (act === "close") closePeek(tab);
        if (act === "stage" || act === "unstage") {
          for (const b of el.querySelectorAll("button")) b.disabled = true;
          stageHunk(tab, h, act === "stage").then(() => closePeek(tab));
        }
        if (act === "restore") {
          closePeek(tab);
          const doc = sess.doc, len = doc.getLength();
          if (h.count === len && !old.length) doc.setValue("");   // every line was new
          else {
            if (h.count) doc.removeFullLines(h.row, h.row + h.count - 1);
            if (old.length) doc.insertFullLines(Math.min(h.row, doc.getLength()), old);
          }
          editor.focus();
        }
      });
      const below = h.count ? h.row + h.count - 1 : Math.max(0, Math.min(h.row, sess.getLength()) - 1);
      tab.peek = { row: below, el, fixedWidth: true, coverGutter: false };
      sess.widgetManager.addLineWidget(tab.peek);
    }
    editor.on("guttermousedown", (e) => {
      const tab = active;
      if (!tab || !/\bgd-/.test(e.domEvent.target.closest?.(".ace_gutter-cell")?.className || "")) return;
      const h = hunkAt(tab, e.getDocumentPosition().row);
      if (!h) return;
      e.stop();
      const again = tab.peek && tab.peekHunk === h;
      closePeek(tab);
      if (!again) { openPeek(tab, h); tab.peekHunk = h; }
    });

    // ---- file tree ----
    // node: { path, name, type, open, kids (null until loaded) }
    const root = { path: "", name: "", type: "dir", open: true, kids: null };
    let selectedDir = ""; // where "new file/folder" lands

    async function loadKids(node) {
      const r = await api("/files" + qs(node.path));
      const old = new Map((node.kids || []).map((k) => [k.name, k]));
      node.kids = r.entries.map((e) => {
        const prev = old.get(e.name);
        return prev && prev.type === e.type ? prev : { path: join(node.path, e.name), name: e.name, type: e.type, open: false, kids: null };
      });
    }

    // ---- git colours ----
    // files: path → state; dirs: folders git reports as a whole (untracked or
    // ignored); inside: folder → the weightiest state of anything changed in it
    let git = { repo: false, files: {}, dirs: {}, staged: {}, inside: new Map() }, gitSeen = "";
    const WEIGHT = { new: 1, renamed: 2, deleted: 2, modified: 2, conflict: 3 };
    const GIT_LABEL = { new: "new", modified: "modified", renamed: "renamed", conflict: "conflict", ignored: "ignored" };

    /** Fetch the workdir's git status; true if it differs from the last one. */
    async function loadGit() {
      let r;
      try { r = await api("/files/status"); } catch { return false; }
      const seen = JSON.stringify(r);
      if (seen === gitSeen) return false;
      gitSeen = seen;
      const inside = new Map();
      const mark = (path, state) => {
        const w = WEIGHT[state];
        if (!w) return; // ignored files say nothing about their folder
        for (let d = parent(path); d; d = parent(d)) if ((inside.get(d) || 0) < w) inside.set(d, w); else break;
      };
      for (const [path, state] of Object.entries(r.files)) mark(path, state);
      for (const [path, state] of Object.entries(r.dirs)) mark(path, state);
      git = { repo: r.repo, branch: r.branch, upstream: r.upstream, ahead: r.ahead || 0, behind: r.behind || 0, remote: !!r.remote,
              files: r.files, dirs: r.dirs, staged: r.staged || {}, inside };
      renderTabs(); // tab labels carry the same colours
      if ($("#commit").classList.contains("show")) renderCommit();
      for (const t of tabs) loadBase(t); // a commit changes what the buffers are measured against
      return true;
    }

    /** The git state a tree row is drawn in ("" = unchanged). */
    function gitState(path, isDir) {
      for (let d = path; d; d = parent(d)) if (git.dirs[d]) return git.dirs[d]; // in (or is) a wholly new/ignored folder
      if (!isDir) return git.files[path] === "deleted" ? "" : git.files[path] || "";
      // a folder: green while everything changed in it is new, amber otherwise
      const w = git.inside.get(path);
      return w === 3 ? "conflict" : w === 2 ? "modified" : w === 1 ? "new" : "";
    }

    function rowsFor(node, depth, out) {
      for (const k of node.kids || []) {
        const pad = 8 + depth * 12;
        const isDir = k.type === "dir";
        const g = gitState(k.path, isDir);
        out.push(`<div class="row ${isDir ? "dir" : "file"}${g ? ` g-${g}` : ""}" data-path="${esc(k.path)}" data-type="${k.type}" style="padding-left:${pad}px" title="${esc(k.path)}${g ? ` — ${isDir && git.inside.has(k.path) && g !== "ignored" ? "contains changes" : GIT_LABEL[g]}` : ""}">
          <span class="tw">${isDir ? (k.open ? "▾" : "▸") : ""}</span><span class="nm">${esc(k.name)}</span>
          <span class="acts"><button data-act="rename" title="Rename / move">✎</button><button data-act="delete" title="Delete">✕</button></span></div>`);
        if (isDir && k.open) {
          if (k.kids && !k.kids.length) out.push(`<div class="tree-msg" style="padding-left:${pad + 26}px">empty</div>`);
          rowsFor(k, depth + 1, out);
        }
      }
      return out;
    }

    function renderTree() {
      const html = rowsFor(root, 0, []).join("");
      $("#tree").innerHTML = html || `<div class="tree-msg">${root.kids ? "the workdir is empty" : "loading…"}</div>`;
      markTreeActive();
    }
    function markTreeActive() {
      for (const r of document.querySelectorAll("#tree .row.active")) r.classList.remove("active");
      if (active) document.querySelector(`#tree .row[data-path="${CSS.escape(active.path)}"]`)?.classList.add("active");
    }

    function findNode(path, node = root) {
      if (node.path === path) return node;
      for (const k of node.kids || []) {
        if (k.path === path) return k;
        if (k.type === "dir" && path.startsWith(k.path + "/")) return findNode(path, k);
      }
      return null;
    }

    /** Re-read every folder that is currently open, keeping the expansion state. */
    async function refreshTree(node = root) {
      if (node === root) loadGit().then((changed) => { if (changed) renderTree(); });
      try { await loadKids(node); } catch (e) { if (node === root) { $("#tree").innerHTML = `<div class="tree-msg">${esc(e.message)}</div>`; throw e; } node.open = false; return; }
      await Promise.all(node.kids.filter((k) => k.type === "dir" && k.open).map((k) => refreshTree(k)));
      if (node === root) renderTree();
    }

    $("#tree").addEventListener("click", async (e) => {
      const row = e.target.closest(".row");
      if (!row) { selectedDir = ""; return; }
      const path = row.dataset.path;
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "rename") return renameEntry(path);
      if (act === "delete") return deleteEntry(path, row.dataset.type);
      if (row.dataset.type === "dir") {
        const node = findNode(path);
        node.open = !node.open;
        selectedDir = path;
        if (node.open && !node.kids) { try { await loadKids(node); } catch (err) { node.open = false; flash(err.message, "bad"); } }
        renderTree();
      } else if (row.dataset.type === "file") {
        selectedDir = parent(path);
        openFile(path);
      } else flash("Not a regular file", "bad");
    });

    async function newEntry(kind) {
      const hint = selectedDir ? selectedDir + "/" : "";
      const input = prompt(`New ${kind} — path relative to the workdir:`, hint);
      if (!input || input === hint) return;
      const path = input.replace(/^\/+|\/+$/g, "");
      try {
        if (kind === "folder") await api("/files", { method: "POST", body: { path } });
        else await api("/file", { method: "PUT", body: { path, content: "", baseHash: null } });
        // open the folders leading to it so it is visible
        let node = root;
        for (const part of parent(path).split("/").filter(Boolean)) {
          await loadKids(node); // re-read: the folder may have just been created
          const next = node.kids.find((k) => k.name === part && k.type === "dir");
          if (!next) break;
          node = next; node.open = true;
        }
        await refreshTree();
        if (kind === "file") openFile(path);
      } catch (e) { flash(e.message, "bad"); }
    }

    async function renameEntry(from) {
      const input = prompt("Rename / move to (path relative to the workdir):", from);
      if (!input) return;
      const to = input.replace(/^\/+|\/+$/g, "");
      if (to === from) return;
      try {
        await api("/files/rename", { method: "POST", body: { from, to } });
        for (const t of tabs) {             // keep open tabs pointing at the moved files
          if (t.path === from) t.path = to;
          else if (t.path.startsWith(from + "/")) t.path = to + t.path.slice(from.length);
          else continue;
          applyMode(t);
        }
        if (active) $("#st-path").textContent = active.path;
        renderTabs();
        await refreshTree();
      } catch (e) { flash(e.message, "bad"); }
    }

    async function deleteEntry(path, type) {
      if (!confirm(`Delete ${type === "dir" ? "the folder" : "the file"} ${path}${type === "dir" ? " and everything in it" : ""}? This cannot be undone.`)) return;
      try {
        await api("/file" + qs(path), { method: "DELETE" });
        for (const t of tabs.filter((t) => t.path === path || t.path.startsWith(path + "/"))) {
          t.dirty = false; closeTab(t);
        }
        await refreshTree();
      } catch (e) { flash(e.message, "bad"); }
    }

    // The agent changes files while this is open: keep the colours current, and
    // re-read the open folders when the status moves (files came or went).
    setInterval(async () => {
      if (document.visibilityState !== "visible") return;
      if (await loadGit()) refreshTree().catch(() => {});
    }, 5000);

    $("#btn-newfile").onclick = () => newEntry("file");
    $("#btn-newdir").onclick = () => newEntry("folder");
    $("#btn-refresh").onclick = () => { refreshTree().catch(() => {}); fileList = null; };

    // sidebar width
    $("#grip").addEventListener("mousedown", (e) => {
      e.preventDefault();
      const move = (ev) => { $("#side").style.width = Math.max(140, Math.min(ev.clientX, innerWidth - 240)) + "px"; editor.resize(); };
      const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
      addEventListener("mousemove", move); addEventListener("mouseup", up);
    });

    // ---- quick open (⌘P) ----
    let fileList = null, palItems = [], palSel = 0;

    /** Subsequence match; higher is better. Rewards runs, word starts, and hits in the file name. */
    function score(path, query) {
      const p = path.toLowerCase(), nameAt = p.lastIndexOf("/") + 1;
      let s = 0, pi = 0, run = 0;
      for (const ch of query) {
        const at = p.indexOf(ch, pi);
        if (at === -1) return -1;
        run = at === pi ? run + 1 : 0;
        s += 1 + run * 3 + (at >= nameAt ? 4 : 0) + (at === nameAt || "/._-".includes(p[at - 1]) ? 6 : 0);
        pi = at + 1;
      }
      return s - path.length * 0.02;
    }

    function renderPalette() {
      const query = $("#pal-input").value.trim().toLowerCase().replace(/\s+/g, "");
      if (!fileList) { $("#pal-list").innerHTML = `<div class="pal-empty">indexing the workdir…</div>`; return; }
      if (!query) palItems = tabs.map((t) => t.path).concat(fileList.filter((f) => !tabs.some((t) => t.path === f))).slice(0, 60);
      else {
        palItems = fileList.map((f) => [score(f, query), f]).filter((x) => x[0] >= 0)
          .sort((a, b) => b[0] - a[0]).slice(0, 60).map((x) => x[1]);
      }
      palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
      $("#pal-list").innerHTML = palItems.length
        ? palItems.map((f, i) => `<div class="pal-item${i === palSel ? " sel" : ""}" data-i="${i}">
            <span>${esc(base(f))}</span><span class="dir">${esc(parent(f))}</span></div>`).join("")
        : `<div class="pal-empty">no files match</div>`;
      $("#pal-list .sel")?.scrollIntoView({ block: "nearest" });
    }

    async function openPalette() {
      $("#palette").classList.add("show");
      $("#pal-input").value = ""; palSel = 0;
      $("#pal-input").focus();
      renderPalette();
      try { fileList = (await api("/files/index")).files; } // re-indexed each time: the agent adds files
      catch (e) { fileList = fileList || []; flash(e.message, "bad"); }
      renderPalette();
    }
    function closePalette() { $("#palette").classList.remove("show"); editor.focus(); }
    function pickPalette(i) { const f = palItems[i]; closePalette(); if (f) openFile(f); }

    $("#btn-open").onclick = openPalette;
    $("#pal-input").addEventListener("input", () => { palSel = 0; renderPalette(); });
    $("#pal-input").addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); renderPalette(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); renderPalette(); }
      else if (e.key === "Enter") { e.preventDefault(); pickPalette(palSel); }
      else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    });
    $("#pal-list").addEventListener("click", (e) => { const it = e.target.closest(".pal-item"); if (it) pickPalette(+it.dataset.i); });
    $("#palette").addEventListener("mousedown", (e) => { if (e.target === $("#palette")) closePalette(); });

    // ---- keys ----
    addEventListener("keydown", (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === "s") { e.preventDefault(); save(); }
      else if (k === "p" && !e.shiftKey) { e.preventDefault(); openPalette(); }
    }, true);
    addEventListener("beforeunload", (e) => { if (tabs.some((t) => t.dirty)) { e.preventDefault(); e.returnValue = ""; } });
    addEventListener("resize", () => editor.resize());

    // popups for requests from this VM that the proxy is holding (see /net-asks.js)
    sadboxNetAsks({
      projectId,
      notify: (msg, warn) => flash(msg, warn ? "bad" : "ok"),
      onAnswered: () => { if (active) editor.focus(); },
    });

    // ---- boot ----
    activate(null);
    renderTree();
    refreshTree().catch(() => {});
  </script>
</body>
</html>
